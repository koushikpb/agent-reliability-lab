    .surface { fill: #1a1a19; } .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .dot { fill: #3987e5; stroke: #1a1a19; } .label { fill: #c3c2b7; } .title { fill: #f0efec; }
