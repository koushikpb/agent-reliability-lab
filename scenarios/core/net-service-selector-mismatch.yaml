# The ticket says the Service selects app=cart-service; list_pods shows the 4.2 pods only carry app.kubernetes.io/name
# labels. Resolved: the selector matches no pods, so the Service has no endpoints.
id: net-service-selector-mismatch
category: easy_lookup
ticket:
  id: T-4003
  title: cart broken on storefront since cart-service 4.2
