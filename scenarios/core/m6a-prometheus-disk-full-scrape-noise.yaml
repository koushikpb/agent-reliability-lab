# Misleading logs: Prometheus logs many scrape timeouts for a few targets, but the gaps come from TSDB writes failing with
# "no space left on device" on its 100Gi volume. Resolved: the storage class allows expansion, so the owner grows the PVC.
id: m6a-prometheus-disk-full-scrape-noise
category: misleading_logs
ticket:
  id: T-5005
  title: grafana dashboards have gaps since last night
  body: >-
    Since roughly 03:00 our Grafana dashboards show gaps for every service, and for the last few hours most
    panels are nearly empty. Alerts that should have fired overnight didn't. Prometheus runs in the
    monitoring namespace. We're the observability team and own that namespace and everything in it.
