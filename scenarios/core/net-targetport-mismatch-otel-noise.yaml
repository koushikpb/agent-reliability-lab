# not on the request path). The cause is that 3.0 listens on 3000 while the ingress hits the Service targetPort 8080. Resolved.
id: net-targetport-mismatch-otel-noise
category: misleading_logs
ticket:
  id: T-4005
  title: shop site returns 502 since storefront-web 3.0
  body: >-
    www.shopfront.example has returned 502 Bad Gateway (the ingress-nginx error page) since storefront-web
    3.0 went out at 09:00. The storefront-web pods in the shop-web namespace are Running and Ready.
    Rolling back is our last resort because 3.0 carries a pricing fix.
