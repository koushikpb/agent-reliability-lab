services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: arlab
      POSTGRES_USER: arlab
      POSTGRES_PASSWORD: arlab
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  pgdata:
